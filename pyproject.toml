[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pps-report"
version = "1.0.0"
description = "Tunnel Concrete Thickness Analyzer — shotcrete thickness analysis from PLY point clouds"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "pyvista>=0.43.0",
    "pyvistaqt>=0.11.0",
    "vtk>=9.0.0",
    "qtpy>=2.4.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "open3d>=0.17.0",
    "matplotlib>=3.5.0",
    "pdfkit>=1.0.0",
    "jinja2>=3.0.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pps-report = "pps_report.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pps_report.report" = ["templates/*.html", "assets/images/*"]
"pps_report.gui" = ["icons/lucide/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
